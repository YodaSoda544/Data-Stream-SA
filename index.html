<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATASTREAM SA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#000;color:#fff}
.wrap{max-width:420px;margin:0 auto;min-height:100vh;padding:24px}
.card{background:#18181b;border-radius:16px;padding:20px;margin-top:16px}
input{width:100%;background:#000;border:1px solid #27272a;border-radius:12px;padding:12px;margin-top:8px;color:#fff}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;font-weight:800;cursor:pointer}
.btn-white{background:#fff;color:#000}
.btn-green{background:#4ade80;color:#000}
.btn-dark{background:#27272a;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.small{font-size:11px;color:#71717a}
.hidden{display:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:32px;font-weight:900">DATASTREAM<span style="color:#4ade80"> SA</span></h1>
  <p class="small" style="margin-top:8px">POPIA safe. WiFi only. Pause anytime.</p>

  <div id="loginBox" class="card">
    <div style="font-weight:700">Login to Start Earning</div>
    <input id="phone" value="+27605759947" placeholder="+27761234567">
    <button id="sendOtpBtn" class="btn-white">Send OTP</button>
    <div id="otpArea" class="hidden">
      <input id="otp" placeholder="Enter 6-digit OTP">
      <button id="verifyBtn" class="btn-green">Verify & Login</button>
    </div>
    <div style="text-align:center" class="small" style="margin:12px 0">— OR SECURE WITH PASSWORD —</div>
    <input id="email" type="email" value="thiikay47@gmail.com" placeholder="you@email.com">
    <input id="password" type="password" placeholder="Password">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button id="pwdLoginBtn" class="btn-dark">Login</button>
      <button id="pwdSignupBtn" class="btn-white">Sign Up</button>
    </div>
    <button id="skipBtn" class="btn-dark" style="border:1px dashed #52525b;margin-top:16px">SKIP LOGIN & TEST APP →</button>
    <div id="debug" class="small" style="margin-top:8px">Ready. Click any button.</div>
  </div>

  <div id="appBox" class="hidden">
    <div class="card">
      <div id="status" class="small">STATUS: LOGGED IN ✓ Soweto Node</div>
      <button id="startBtn" class="btn-green" style="font-size:20px;padding:20px">START STREAMING</button>
      <div class="grid3">
        <div><div id="mb" style="font-weight:800">0 MB</div><div class="small">Shared</div></div>
        <div><div id="tests" style="font-weight:800">0</div><div class="small">Tests</div></div>
        <div><div id="earn" style="font-weight:800;color:#4ade80">R0.00</div><div class="small">Live</div></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700">Wallet</div>
      <div id="wallet" style="font-size:32px;font-weight:900;margin-top:8px">R0.00</div>
      <button class="btn-white" onclick="alert('Payout queued - Check Supabase payouts table')">Cash out R50 min</button>
      <button id="logoutBtn" class="btn-dark" style="margin-top:8px">Logout</button>
      <div id="userInfo" class="small" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// === KEYS AT BOTTOM - REPLACE THESE 2 LINES ===
const SUPABASE_URL = 'https://bzckhrceodpfxmmukwtb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4kBaLAupghyG0FeIxq1L-w_m23waPmr';
// ==============================================
let supabaseClient = null;
let currentUser = null;
let walletTotal = 0;

function getClient(){
  if(!supabaseClient){
    try{ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
catch(e){ document.getElementById('debug').innerText = 'KEY ERROR: Replace keys at bottom'; throw e; }
  }
  return supabaseClient;
}
function showApp(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  document.getElementById('userInfo').innerText = currentUser ? (currentUser.email || currentUser.phone) : 'Demo Mode';
}
function showLogin(){ document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('appBox').classList.add('hidden'); }

document.addEventListener('DOMContentLoaded', ()=>{
  const debug = document.getElementById('debug');
  debug.innerText = 'Buttons Active - Click works!';

  document.getElementById('sendOtpBtn').onclick = async ()=>{
    debug.innerText = 'Sending OTP...';
    try{
      const client = getClient();
      const phone = document.getElementById('phone').value.trim();
      const {error} = await client.auth.signInWithOtp({phone});
      if(error){ debug.innerText = error.message; alert('OTP Error: '+error.message+' - Use Password Login'); }
      else{ document.getElementById('otpArea').classList.remove('hidden'); debug.innerText = 'OTP Sent!'; }
    }catch(e){ alert('Fix keys at bottom: '+e.message); }
  };

  document.getElementById('verifyBtn').onclick = async ()=>{
    const client = getClient();
    const phone = document.getElementById('phone').value.trim();
    const token = document.getElementById('otp').value.trim();
    const {data,error} = await client.auth.verifyOtp({phone, token, type:'sms'});
    if(error) alert(error.message); else { currentUser=data.user; showApp(); }
  };

  document.getElementById('pwdLoginBtn').onclick = async ()=>{
    debug.innerText = 'Logging in...';
    try{
      const client = getClient();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const {data,error} = await client.auth.signInWithPassword({email,password});
      if(error){ debug.innerText = error.message; alert(error.message); }
      else{ currentUser=data.user; showApp(); }
    }catch(e){ alert(e.message); }
  };

  document.getElementById('pwdSignupBtn').onclick = async ()=>{
    debug.innerText = 'Creating account...';
    try{
      const client = getClient();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if(password.length<6) return alert('Password min 6 chars');
      const {data,error} = await client.auth.signUp({email,password});
      if(error) alert(error.message); else { alert('Account created! Now click Login'); debug.innerText='Account created - Click Login'; }
    }catch(e){ alert(e.message); }
  };

  document.getElementById('skipBtn').onclick = ()=>{
    currentUser = null; showApp(); alert('Demo mode - You are past login! Now fix keys at bottom to enable real wallet');
  };

  document.getElementById('logoutBtn').onclick = async ()=>{
    try{ await getClient().auth.signOut(); }catch{}
    currentUser=null; showLogin();
  };

  document.getElementById('startBtn').onclick = ()=>{
    let mb=0; const btn=document.getElementById('startBtn');
    btn.innerText='STREAMING...'; btn.className='btn-red';
    setInterval(()=>{ mb+=2; document.getElementById('mb').innerText=mb+' MB'; document.getElementById('earn').innerText='R'+(mb*0.05).toFixed(2); },1000);
  };

  // Auto-login if session exists
  try{
    const client = getClient();
    client.auth.getSession().then(({data})=>{ if(data.session){ currentUser=data.session.user; showApp(); }});
  }catch{}
});
</script>
</body>
</html>
