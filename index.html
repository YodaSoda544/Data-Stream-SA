<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATASTREAM SA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div class="max-w-[420px] mx-auto min-h-screen p-6">
  <h1 class="text-3xl font-black">DATASTREAM<span class="text-green-400"> SA</span></h1>
  <p class="text-zinc-400 text-sm mt-2">POPIA safe. WiFi only. Pause anytime.</p>

  <div id="loginBox" class="bg-zinc-900 rounded-2xl p-5 mt-6">
    <div class="font-bold">Login to Start Earning</div>
    <input id="phone" placeholder="+27761234567" value="+27605759947" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mt-3 text-white">
    <button id="sendOtpBtn" class="w-full bg-white text-black font-bold py-3 rounded-xl mt-3">Send OTP</button>
    <div id="otpArea" class="hidden">
      <input id="otp" placeholder="Enter 6-digit OTP" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mt-3 text-white">
      <button id="verifyBtn" class="w-full bg-green-400 text-black font-bold py-3 rounded-xl mt-3">Verify & Login</button>
    </div>
    <div class="text-center text-zinc-600 text-xs my-4">— OR SECURE WITH PASSWORD —</div>
    <input id="email" type="email" placeholder="you@email.com" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-white">
    <input id="password" type="password" placeholder="Password (min 6 chars)" class="w-full bg-black border border-zinc-800 rounded-xl p-3 mt-2 text-white">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button id="pwdLoginBtn" class="bg-zinc-800 font-bold py-3 rounded-xl">Login</button>
      <button id="pwdSignupBtn" class="bg-white text-black font-bold py-3 rounded-xl">Sign Up</button>
    </div>
  </div>

  <div id="appBox" class="hidden">
    <div class="bg-zinc-900 rounded-2xl p-5 mt-6">
      <div id="status" class="text-xs text-zinc-500">STATUS: IDLE</div>
      <div id="proBadge" class="hidden bg-green-400 text-black text-xs font-bold px-2 py-1 rounded inline-block mt-2">PRO +20% ACTIVE</div>
      <button id="startBtn" class="w-full bg-green-400 text-black font-black text-xl py-5 rounded-xl mt-4">START STREAMING</button>
      <div class="grid grid-cols-3 gap-2 mt-5 text-center">
        <div><div id="mb" class="font-bold text-lg">0 MB</div><div class="text-xs text-zinc-500">Shared</div></div>
        <div><div id="tests" class="font-bold text-lg">0</div><div class="text-xs text-zinc-500">Tests</div></div>
        <div><div id="earn" class="font-bold text-lg text-green-400">R0.00</div><div class="text-xs text-zinc-500">Live</div></div>
      </div>
    </div>
    <div class="bg-zinc-900 rounded-2xl p-5 mt-4">
      <div class="font-bold">Wallet</div>
      <div id="wallet" class="text-3xl font-black mt-2">R0.00</div>
      <button onclick="doPayout('paystack')" class="w-full bg-white text-black font-bold py-3 rounded-xl mt-4">Cash out R50 min</button>
      <div class="text-xs text-zinc-500 mt-2" id="userInfo"></div>
    </div>
    <div id="proBox" class="bg-gradient-to-br from-green-400 to-emerald-600 text-black rounded-2xl p-5 mt-4">
      <div class="font-black">Go PRO +20%</div>
      <button id="proBtn" class="w-full bg-black text-white font-bold py-3 rounded-xl mt-3">Unlock PRO R29/week</button>
    </div>
  </div>
</div>

<!-- SMOOTH FLOW: Libs at bottom -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@revenuecat/purchases-js@1/dist/index.global.js"></script>

<script>
let supabaseClient=null, currentUser=null, streaming=false, interval=null, totalMb=0, totalEarn=0, walletTotal=0, isPro=false
const RATE_PER_GB=0.30, RATE_PER_TEST=0.0005, ZAR_RATE=18.5

function initHandlers(){
// FIX: Buttons now always clickable
  document.getElementById('sendOtpBtn').onclick=async()=>{
    const phone=document.getElementById('phone').value.trim()
    if(!supabaseClient) return alert('Supabase not ready - check keys at bottom')
    const btn=document.getElementById('sendOtpBtn'); btn.innerText='Sending...'; btn.disabled=true
    const {error}=await supabaseClient.auth.signInWithOtp({phone})
    if(error){ alert('OTP: '+error.message+' - Use password login'); btn.innerText='Send OTP'; btn.disabled=false }
    else{ document.getElementById('otpArea').classList.remove('hidden'); btn.innerText='OTP Sent' }
  }
  document.getElementById('verifyBtn').onclick=async()=>{
    const phone=document.getElementById('phone').value.trim(), token=document.getElementById('otp').value.trim()
    const {data,error}=await supabaseClient.auth.verifyOtp({phone,token,type:'sms'})
    if(error) alert(error.message); else { currentUser=data.user; initApp() }
  }
  document.getElementById('pwdLoginBtn').onclick=async()=>{
    const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value.trim()
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password})
    if(error) alert(error.message); else { currentUser=data.user; initApp() }
  }
  document.getElementById('pwdSignupBtn').onclick=async()=>{
    const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value.trim()
    const {data,error}=await supabaseClient.auth.signUp({email,password})
    if(error) alert(error.message); else alert('Account created! Confirm email then Login')
  }
  document.getElementById('startBtn').onclick=()=>{
    streaming=!streaming; const btn=document.getElementById('startBtn')
    if(streaming){
      btn.innerText='STOP STREAMING'; btn.className='w-full bg-red-500 text-white font-black text-xl py-5 rounded-xl mt-4 animate-pulse'
      interval=setInterval(async()=>{
        const fakeMb=parseFloat((Math.random()*4+1).toFixed(2))
        const usd=((fakeMb/1024*RATE_PER_GB)+(1*RATE_PER_TEST))*(isPro?1.2:1); const zar=usd*ZAR_RATE
        totalMb+=fakeMb; totalEarn+=zar
        document.getElementById('mb').innerText=${totalMb.toFixed(0)} MB; document.getElementById('earn').innerText=R${totalEarn.toFixed(2)}
        if(currentUser) await supabaseClient.from('earnings_ledger').insert({user_id:currentUser.id, type:'bandwidth', mb:fakeMb, amount_usd:usd, amount_zar:zar, status:'available'})
      },5000)
    }else{ clearInterval(interval); btn.innerText='START STREAMING'; btn.className='w-full bg-green-400 text-black font-black text-xl py-5 rounded-xl mt-4' }
  }
  document.getElementById('proBtn').onclick=async()=>{
    try{
      if(!currentUser) return alert('Login first')
      const Purchases=window.RevenueCat.Purchases
      await Purchases.configure({apiKey:REVENUECAT_PUBLIC_KEY, appUserId:currentUser.id})
      const offerings=await Purchases.getOfferings()
      const pkg=offerings.current?.monthly||offerings.current?.availablePackages[0]
      const result=await Purchases.purchasePackage(pkg)
      if(result.customerInfo.entitlements.active['data_stream_sa_pro']||result.customerInfo.entitlements.active['pro']){
        await supabaseClient.from('profiles').update({is_pro:true}).eq('id',currentUser.id)
        document.getElementById('proBadge').classList.remove('hidden'); alert('PRO Active')
      }
    }catch(e){ alert(e.message) }
  }
}

async function initApp(){
  if(!supabaseClient) return
  const {data:{user}}=await supabaseClient.auth.getUser()
  if(user) currentUser=user; if(!currentUser) return
  document.getElementById('loginBox').classList.add('hidden')
  document.getElementById('appBox').classList.remove('hidden')
  document.getElementById('userInfo').innerText=Logged in as ${currentUser.email||currentUser.phone}
const {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).single()
  if(profile && profile.is_pro){ isPro=true; document.getElementById('proBadge').classList.remove('hidden') }
  const {data:ledger}=await supabaseClient.from('earnings_ledger').select('amount_zar').eq('user_id',currentUser.id).eq('status','available')
  walletTotal=ledger?ledger.reduce((s,r)=>s+r.amount_zar,0):0
  document.getElementById('wallet').innerText=R${walletTotal.toFixed(2)}
}
async function doPayout(method){
  const amt=prompt('Amount ZAR'); if(!amt) return
  if(parseFloat(amt)>walletTotal) return alert('Insufficient')
  await supabaseClient.from('payouts').insert({user_id:currentUser.id, method, amount_zar:amt, status:'processing'})
  alert('Payout queued')
}

// ===== KEYS AT THE BOTTOM - FOR SMOOTH FLOW =====
const SUPABASE_URL = 'https://bzckhrceodpfxmmukwtb.supabase.co' // <-- REPLACE ME
const SUPABASE_ANON_KEY = 'sb_publishable_4kBaLAupghyG0FeIxq1L-w_m23waPmr' // <-- REPLACE ME
const REVENUECAT_PUBLIC_KEY = 'test_PatLVgeAMwkDAojpfczvlEVbDwc' // <-- REPLACE ME

// Init after keys are defined
try{
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  initHandlers()
  supabaseClient.auth.getSession().then(({data})=>{ if(data.session){ currentUser=data.session.user; initApp() } })
  console.log('DATASTREAM SA ready - keys loaded at bottom')
}catch(e){ console.error('Key error:', e); alert('Check Supabase keys at bottom of file - '+e.message) }
// ================================================
</script>
</body>
</html>
