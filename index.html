<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#000;color:#fff;font-family:system-ui;padding:20px;max-width:400px;margin:auto}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#111;color:#fff;border:1px solid #333}button{width:100%;padding:14px;margin:6px 0;border-radius:8px;font-weight:800} .w{background:#fff;color:#000} .g{background:#4ade80} .d{background:#222;color:#fff}</style>
</head><body>
<h2>DATASTREAM TEST LOGIN</h2>
<p id="debug" style="color:#4ade80">Ready</p>
<input id="email" placeholder="you@gmail.com">
<input id="password" type="password" placeholder="password123">
<button class="w" onclick="doSignup()">Sign Up</button>
<button class="g" onclick="doLogin()">Login</button>
<button class="d" onclick="skip()">SKIP → App</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://bzckhrceodpfxmmukwtb.supabase.co';
const SUPABASE_KEY='sb_publishable_4kBaLAupghyG0FeIxq1L-w_m23waPmr';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function log(m){document.getElementById('debug').innerText=m; console.log(m);}
async function doSignup(){
  const e=document.getElementById('email').value; const p=document.getElementById('password').value;
  log('Creating '+e); const {error}=await supa.auth.signUp({email:e,password:p});
  if(error){log(error.message); alert(error.message);} else {log('Created '+e+' Now click Login'); alert('Created, now Login');}
}
async function doLogin(){
  const e=document.getElementById('email').value; const p=document.getElementById('password').value;
  log('Logging '+e); const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});
  if(error){log('FAIL '+error.message); alert(error.message);} else {log('OK '+data.user.email); alert('Logged in!'); location.href='/';}
}
function skip(){log('Demo mode'); alert('Demo - we will add full app after login works');}
log('Buttons armed - type email and click');
</script>
</body></html>
